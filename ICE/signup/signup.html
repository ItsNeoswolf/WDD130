<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #786040;
            margin: 0;
        }

        #formContainer {
            background: white;
            border: 10px solid navy;
            border-radius: 30px;
            margin: 0 auto;
            max-width: 90%;
            overflow: hidden;
            width: 420px;
        }

        .hero {
            height: 170px;
            position: relative;
        }

        .hero-image {
            height: 170px;
            object-fit: cover;
            width: 100%;
        }

        .hero-copy {
            color: white;
            position: absolute;
            top: 35%;
            width: 100%;
            text-align: center;
            text-shadow: 2px 2px black;
        }

        #closeBtn {
            position: absolute;
            top: 10px;
            left: 10px;
        }

        #formContainer > h3 {
            margin: 18px 0 12px;
            text-align: center;
        }

        #myForm {
            padding: 0 20px 18px;
        }

        .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            margin: 12px 0;
        }

        .field-row > input {
            width: 100%;
        }

        .radio-options {
            white-space: nowrap;
        }

        .check-row,
        .submit-row {
            margin: 14px 0;
            text-align: center;
        }

        .book-strip {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
        }

        .book-strip img {
            height: 100px;
            object-fit: cover;
            width: 100%;
        }
    </style>




</head>

<body>
    <div id="formContainer">
        <header class="hero">
            <img class="hero-image" src="images/jesus_feeds_5000.jpeg" alt="">
            <div class="hero-copy">
                <h1>Daily Feed</h1>
                <p>Scripture a Day</p>
            </div>
            <button type="button" id="closeBtn" aria-label="Close sign-up form">X</button>
        </header>
        <h3>Sign Up for Daily Scripture Feed</h3>
        <form id="myForm">
            <div class="field-row">
                <label for="username">User Name:</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="field-row">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="field-row">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="field-row">
                <span class="field-label">Gender:</span>
                <div class="radio-options">
                    <label for="male"><input type="radio" id="male" name="gender" value="male" required>Male</label>
                    <label for="female"><input type="radio" id="female" name="gender" value="female" required>Female</label>
                </div>
            </div>

            <section class="check-row">
                <label for="newsletter"><input type="checkbox" id="newsletter" name="newsletter">Subscribe to newsletter</label>
            </section>

            <section class="check-row">
                <label for="conditions"><input type="checkbox" id="conditions" name="conditions" required>I acknowledge the terms and conditions</label>
            </section>

            <section class="submit-row">
                <button type="submit">Submit</button>
            </section>
        </form>

        <footer class="book-strip">
            <img src="images/old_testament.webp" alt="Old Testament">
            <img src="images/new_testament.webp" alt="New Testament">
            <img src="images/book_of_mormon.webp" alt="Book of Mormon">
            <img src="images/doctrine_and_covenants.webp" alt="Doctrine and Covenants">
            <img src="images/pearl_of_great_price.webp" alt="Pearl of Great Price">
        </footer>
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
